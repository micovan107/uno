<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Bài Đăng</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/post.css">
</head>
<body>
    <header id="main-header">
        <div class="header-container">
            <a href="/" class="logo">vex</a>
            <nav class="main-nav">
                <div id="user-menu" class="user-menu"></div>
            </nav>
        </div>
    </header>

    <main class="container" id="post-container">
        <!-- Nội dung bài đăng sẽ được JS render vào đây -->
        <div id="post-content-area">
            <p>Đang tải bài đăng...</p>
        </div>

        <!-- Vị trí cho các reaction -->
        <div id="post-reactions"></div>

        <!-- Form bình luận chính -->
        <section class="comment-form-section">
            <h3>Bình luận của bạn</h3>
            <div id="comment-login-prompt" style="display: none;">
                <p>Vui lòng <a href="login.html">đăng nhập</a> để bình luận.</p>
            </div>
            <form id="main-comment-form" style="display: block;">
                <div class="comment-input-wrapper">
                    <!-- Avatar người dùng sẽ được JS chèn vào đây -->
                    <textarea id="comment-text" placeholder="Chia sẻ suy nghĩ của bạn..." required></textarea>
                </div>
                
                <!-- Container cho các bản xem trước media -->
                <div id="media-preview-container">
                    <!-- Các bản xem trước sẽ được JS chèn vào đây -->
                </div>

                <div class="comment-form-footer">
                    <div class="comment-toolbar">
                        <label for="upload-media-input" class="toolbar-btn" title="Tải ảnh lên">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                        </label>
                        <input type="file" id="upload-media-input" accept="image/*" style="display: none;">
                        
                        <button type="button" id="attach-media-link-btn" class="toolbar-btn" title="Đính kèm ảnh/video từ link">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"></path></svg>
                        </button>
                    </div>
                    <button type="submit">Gửi Bình Luận</button>
                </div>
            </form>
        </section>

        <!-- Khu vực hiển thị bình luận -->
        <section class="comments-section">
            <h3>Tất cả bình luận (<span id="comment-count">0</span>)</h3>
            <div id="comments-list">
                <!-- Danh sách bình luận sẽ được JS render vào đây -->
            </div>
        </section>
    </main>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/post.js"></script>
</body>
</html>
